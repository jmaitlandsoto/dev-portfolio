server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Live Pi stats sidecar. Resolving at request time (instead of at startup)
    # means nginx still starts and serves the site if pistats is down.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $pistats http://pistats:3300;
        proxy_pass $pistats;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?|ttf)$ {
        expires 30d;
        access_log off;
    }
}
